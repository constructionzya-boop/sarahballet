function T(x,y,s,{fs=13,c=INK,a="middle",w=600,rot=0}={}){out+=`<text x="${x}" y="${y}" font-size="${fs}" fill="${c}" text-anchor="${a}" font-weight="${w}"${rot?` transform="rotate(${rot} ${x} ${y})"`:""} dominant-baseline="middle">${esc(s)}</text>`;}

function dimH(xa,xb,y,label,{oy=-11,fs=12}={}){L(xa,y,xb,y,1,OR);tick(xa,y);tick(xb,y);T((xa+xb)/2,y+oy,label,{fs,c:OR,w:700});}

function leader(x,y,tx,ty){L(x,y,tx,ty,0.9,NAVY);C(x,y,2,{f:NAVY,s:"none"});}
function callout(x,y,tx,ty,letter){leader(x,y,tx,ty);C(tx,ty,11,{f:"#fff",sw:1.6});T(tx,ty,letter,{fs:12,w:800});}
